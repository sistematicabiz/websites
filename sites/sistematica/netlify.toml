# Netlify site: sistematica.biz
# In Netlify: Base directory = (repo root), Package directory = sites/sistematica
[build]
  command = "npm run build:sistematica"
  publish = "sites/sistematica/_site"
  # Skip the build unless this site, shared/ or dependencies changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- sites/sistematica shared package.json package-lock.json"

[build.environment]
  NODE_VERSION = "22"
