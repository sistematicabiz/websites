# Netlify config for the sistematica site.
# In the Netlify UI: Base directory = (empty, repo root), Package directory = sites/sistematica.
# All paths below are relative to the repo root.

[build]
  command = "npm run build:sistematica"
  publish = "sites/sistematica/_site"
  # Skip the build (exit 0) unless something this site depends on changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- sites/sistematica shared content/sistematica content/shared content/media package.json package-lock.json .nvmrc"

[build.environment]
  NODE_VERSION = "22"

# Files whose names change with their content can be cached for a year.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/media/opt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
