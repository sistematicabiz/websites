# "What I do": the three practice-area tiles, in order.
#   n: the numeral shown on the tile; title: heading; paragraphs: one item per paragraph.

- 'n': i.
  title: Research and strategic analysis
  paragraphs:
    - I help clients make sense of complex questions at the intersection of finance, sustainability, economic systems and real-world impacts. My work is grounded in sound evidence, careful framing, and close attention to the institutional, regulatory, and market context in which decisions are made.
    - The aim is not simply to produce analysis, but to clarify the choices, assumptions, risks, and opportunities that matter for long-term strategy.

- 'n': ii.
  title: Sustainable finance and investment insight
  paragraphs:
    - I provide research and advisory support to organizations seeking to connect investment practice with climate resilience, social and ecological outcomes, and durable value creation.
    - 'This can include work on sustainable and faith-aligned investment approaches, thematic and impact strategies, financial products, and the evolving materiality of environmental and social factors. The emphasis is always on analytical rigor: translating broad ambitions into credible, usable frameworks and decisions.'

- 'n': iii.
  title: Thought leadership and convening
  paragraphs:
    - I help organizations develop research, narratives, and forums that bring complex ideas into productive public and professional conversation.
    - This includes reports, white papers, presentations, workshops, executive briefings, and stakeholder convenings for investment, policy, academic, and mission-driven audiences. I combine research depth with clear communication, helping clients articulate ideas that are both intellectually serious and practically relevant.
