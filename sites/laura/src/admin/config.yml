              - label: Author
                name: author
                widget: string
                required: false
              - label: Organization
                name: organization
                widget: string
                required: false
          - label: About
            name: about
            widget: object
            hint: The role chips come from Roles ("Show on Sistematica").
            fields:
              - label: Photo
                name: photo
                widget: image
              - label: Photo description (alt text)
                name: photo_alt
                widget: string
              - label: Eyebrow
                name: eyebrow
                widget: string
              - label: Name
                name: name
                widget: string
              - label: One-line title
                name: title_line
                widget: string
              - label: Bio
                name: bio
                widget: markdown
                buttons:
                  - bold
                  - italic
                  - link
                editor_components: []
              - label: Profile button text
