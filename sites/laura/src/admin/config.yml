        label: Site settings
        file: content/laura/settings.yml
        fields:
          - label: Site name
            name: title
            widget: string
            hint: Shown in the header and in browser tabs.
          - label: Site address
            name: url
            widget: string
          - label: Language
            name: lang
            widget: hidden
            default: en
          - label: Default search description
            name: description
            widget: text
            hint: Shown by Google when a page has no description of its own.
          - label: Colour theme
            name: theme
            widget: select
            options:
              - label: Primari (red, green, blue, yellow)
                value: primari
              - label: Verde (greens)
                value: verde
          - label: Social sharing image
            name: share_image
            widget: image
            hint: Shown when a page is shared on social media. Use 1200 x 630 pixels.
          - label: Contact email
            name: contact_email
            widget: string
            hint: Where contact form messages should go. Set the same address in Netlify > Forms > notifications.
