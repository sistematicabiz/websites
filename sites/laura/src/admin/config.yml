# Sveltia CMS configuration (Netlify/Decap CMS compatible format)
# Docs: https://sveltiacms.app/en/docs
#
# backend: GitHub repo, branch main. Login uses Netlify as OAuth client (set up on the laura Netlify site): keep base_url unset.
# publish_mode editorial_workflow: every change is a draft (a pull request) until it is published from the CMS.
# media_folder: uploaded images are stored in content/media and served at /media/ by both sites.
# Text fields typed as headings accept &shy; to mark where a long word may break.

backend:
  name: github
  repo: sistematicabiz/websites
  branch: main
publish_mode: editorial_workflow
media_folder: content/media
public_folder: /media
site_url: https://laurasegafredo.com
collections:
  - name: laura_pages
    label: Pages (Laura)
    label_singular: Page
    description: The text and photos of each page of laurasegafredo.com.
    editor:
      preview: false
    files:
      - name: home
        label: Home
        file: content/laura/pages/home.md
        fields:
          - label: Page title (browser tab)
            name: title
            widget: string
          - label: Search description
            name: description
            widget: text
            required: false
            hint: Optional. Shown by Google under the page title. Leave empty to use the site's default description.
          - label: Opening
            name: hero
            widget: object
            collapsed: false
            fields:
              - label: Name lines
                name: name_lines
                widget: list
                hint: The big name, one line each.
              - label: Tagline
                name: tagline
                widget: string
              - label: Intro
                name: intro
                widget: markdown
                buttons:
                  - bold
                  - italic
                  - link
                editor_components: []
              - label: Buttons
                name: buttons
                widget: list
                summary: "{{label}}"
                hint: The first button is filled, the others are outlined.
                fields:
                  - label: Button text
                    name: label
                    widget: string
                  - label: Link
                    name: url
                    widget: string
                    hint: A page (/writing/), a section of this page (#areas) or a full address (https://…).
              - label: Photo
                name: photo
                widget: image
              - label: Photo description (alt text)
                name: photo_alt
                widget: string
              - label: Photo caption
                name: photo_caption
                widget: string
                required: false
              - label: Themes line
                name: themes_line
                widget: string
                hint: Line under the colour blocks, e.g. Finance · Ecology · Ethics.
          - label: Area cards
            name: areas
            widget: list
            summary: "{{title}}"
            hint: The coloured cards under the opening. Colours follow the position, so keep the red and green cards apart when reordering.
            fields:
              - label: Eyebrow
                name: eyebrow
                widget: string
                hint: Small line above the title.
              - label: Title
                name: title
                widget: string
              - label: Text
                name: text
                widget: text
              - label: Link text
