  - name: sistematica_settings
    label: Settings (Sistematica)
    editor:
      preview: false
    files:
      - name: settings
        label: Site settings
        file: content/sistematica/settings.yml
        fields:
          - label: Site name
            name: title
            widget: string
            hint: Shown in browser tabs.
          - label: Site address
            name: url
            widget: string
          - label: Language
            name: lang
            widget: hidden
            default: en
          - label: Default search description
            name: description
            widget: text
          - label: Colour theme
            name: theme
            widget: select
            options:
              - label: Primari (red, green, blue, yellow)
                value: primari
              - label: Verde (greens)
                value: verde
          - label: Social sharing image
            name: share_image
            widget: image
            hint: Shown when a page is shared on social media. Use 1200 x 630 pixels.
          - label: Contact email
            name: contact_email
            widget: string
            hint: >-
              Where contact form messages should go. Set the same address in Netlify > Forms > notifications for the
              Sistematica site.
          - label: Links
            name: links
            widget: object
            fields:
              - label: LinkedIn
                name: linkedin
                widget: string
              - label: laurasegafredo.com
                name: laura
                widget: string
          - label: Menu
            name: nav
            widget: list
            summary: "{{label}}"
            fields:
              - label: Text
                name: label
                widget: string
              - label: Link
                name: url
                widget: string
                hint: "A section of the page: #about, #what, #collaborations or #contact."
          - label: Footer
            name: footer
            widget: object
            fields:
              - label: Text
                name: text
                widget: string
              - label: laurasegafredo.com link text
                name: laura_label
                widget: string
  - name: collaborations
    label: Sistematica · Collaborations
    label_singular: Collaboration
    description: The "Selected collaborations" section of the Sistematica home page.
    folder: content/sistematica/collaborations
    create: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}} · {{area}}"
    sortable_fields:
      - order
      - name
    fields:
      - label: Name
        name: name
        widget: string
        hint: e.g. Bountiful Financial
      - label: Area
        name: area
        widget: string
        hint: Short vertical label on the photo, e.g. Faith-aligned investing.
      - label: Description
        name: description
        widget: text
      - label: Links
        name: links
        widget: list
        required: false
        summary: "{{label}}"
        fields:
          - label: Link text
            name: label
            widget: string
          - label: URL
            name: url
            widget: string
            hint: Full address starting with https://
      - label: Photo
        name: image
        widget: image
        required: false
      - label: Photo description (alt text)
        name: image_alt
        widget: string
        required: false
        hint: Required if you add a photo.
      - label: Photo focus
        name: image_position
        widget: string
        required: false
        hint: Optional. Which part of the photo stays visible when it is cropped, e.g. 50% 30% (horizontal, vertical).
      - label: Order
        name: order
        widget: number
        value_type: int
        required: false
        hint: Lower numbers come first.
