                widget: text
                hint: Press Enter for a line break.
              - label: Button text
                name: button_label
                widget: string
  - name: speaking
    label: Speaking & Press
    label_singular: Speaking or press item
    description: >-
      Talks, interviews, podcasts and articles. All items appear on the Speaking & Press page; items marked "Show on
      home" also appear in the "In Dialogue" block on the home page.
    folder: content/laura/speaking
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{outlet}} · {{type}}: {{title}}"
    sortable_fields:
      - order
      - date
      - outlet
      - title
    view_filters:
      - label: Shown on home
        field: featured
        pattern: true
    fields:
      - label: Outlet
        name: outlet
        widget: string
        hint: Who published or hosted it, e.g. Financial Times.
      - label: Short outlet name
        name: short_outlet
        widget: string
        required: false
        hint: Optional shorter name used on the home page (e.g. AS/COA). Leave empty to use the full outlet name.
      - label: Type
        name: type
        widget: select
        options:
          - Letter
          - Podcast
          - Conference
          - Webinar
          - Panel
          - Talk
          - Interview
          - Article
      - label: Title
        name: title
        widget: string
      - label: Abstract
        name: abstract
        widget: text
        hint: One or two sentences shown on the Speaking & Press page.
      - label: Link text
        name: link_label
        widget: string
        required: false
        hint: e.g. "Read the letter" or "Listen to the conversation". An arrow is added automatically.
      - label: Link URL
        name: link_url
        widget: string
        required: false
        hint: >-
          Full address starting with https://. Leave empty if there is no link yet; the item is then shown without a
          link.
      - label: Date
        name: date
        widget: datetime
        required: false
        date_format: MMMM D, YYYY
        time_format: false
        format: YYYY-MM-DD
        hint: When it was published or took place. Used to sort items that have the same order number.
      - label: Image
        name: image
        widget: image
        required: false
        hint: Optional. Shown inside the card, below the text.
      - label: Image description (alt text)
        name: image_alt
        widget: string
        required: false
        hint: Required if you add an image. Describe what the picture shows, for people who cannot see it.
      - label: Show on home
        name: featured
        widget: boolean
        default: false
        required: false
      - label: Order
        name: order
        widget: number
        value_type: int
        required: false
        hint: Lower numbers come first. Items without a number go last, newest first.
    preview_path: speaking/
  - name: roles
    label: Roles
    label_singular: Role
    description: >-
      Laura's current roles. Each role can appear on the About page ("Current roles"), on the Finance & Climate page
      (cards) and in the Sistematica bio (chips).
    folder: content/shared/roles
    create: true
    slug: "{{slug}}"
    identifier_field: organization
    summary: "{{organization}} · {{role}}"
    sortable_fields:
      - order
      - organization
      - group
    fields:
      - label: Organization
        name: organization
        widget: string
        hint: e.g. Universe Partners. The word Sistematica is styled automatically.
      - label: Role
        name: role
        widget: string
        hint: Label on the Finance & Climate card, e.g. Senior Advisor.
      - label: Short line (About page)
        name: short_line
        widget: string
        hint: Shown next to the organization under "Current roles" on the About page.
      - label: Description (Finance & Climate page)
        name: body
        widget: markdown
        required: false
        buttons:
          - bold
          - italic
          - link
        editor_components: []
        hint: Text of the card on the Finance & Climate page. Leave empty if the role is not shown there.
      - label: Link URL
        name: link_url
        widget: string
        hint: Full address (https://…) or a page of this site such as /writing/.
      - label: Link text (Finance & Climate)
        name: link_label
        widget: string
        required: false
        hint: e.g. "Visit Arketa". An arrow is added automatically.
      - label: Link text (About page)
        name: short_link_label
        widget: string
        required: false
        hint: Shorter link text for the About page, e.g. "Website". Leave empty to reuse the text above.
      - label: Group
        name: group
        widget: select
        options:
          - Advisory & investment
          - Boards & other initiatives
          - Other
        hint: Section of the Finance & Climate page where the card appears.
      - label: Card colour (Finance & Climate)
        name: colour
        widget: select
        required: false
        default: none
        options:
          - label: None (light grey)
            value: none
          - label: Colour 1 (red)
            value: c1
          - label: Colour 2 (green)
            value: c2
          - label: Colour 3 (blue)
            value: c3
          - label: Colour 4 (yellow)
            value: c4
          - label: Sistematica (deep green)
            value: sistematica
      - label: Show on About page
        name: show_on_about
        widget: boolean
        default: true
        required: false
      - label: Show on Finance & Climate page
        name: show_on_finance
        widget: boolean
        default: false
        required: false
      - label: Show on Sistematica
        name: show_on_sistematica
        widget: boolean
        default: false
        required: false
      - label: Chip text (Sistematica)
        name: sistematica_chip
        widget: string
        required: false
        hint: Text of the chip in the Sistematica bio, e.g. "Board, Arketa". Leave empty for "Role, Organization".
      - label: Order
        name: order
        widget: number
        value_type: int
        required: false
        hint: Lower numbers come first.
  - name: sistematica_pages
    label: Pages (Sistematica)
    label_singular: Page
    description: >-
      The text and photos of the Sistematica home page. Collaborations and role chips are edited in their own
      collections.
    editor:
      preview: false
    files:
      - name: home
        label: Home
        file: content/sistematica/pages/home.md
        fields:
          - label: Page title (browser tab)
            name: title
            widget: string
          - label: Search description
            name: description
            widget: text
            required: false
            hint: Optional. Leave empty to use the site's default description.
          - label: Opening
            name: hero
            widget: object
            collapsed: false
            hint: The big name Sistem·at·ica is part of the design and is not edited here.
            fields:
              - label: Eyebrow
                name: eyebrow
                widget: string
              - label: Subtitle
                name: subtitle
                widget: string
              - label: Lead
                name: lead
                widget: text
                hint: The larger first paragraph.
              - label: Second paragraph
                name: text
                widget: markdown
                buttons:
                  - bold
                  - italic
                  - link
                editor_components: []
              - label: Buttons
                name: buttons
                widget: list
                summary: "{{label}}"
                hint: The first button is filled, the others are outlined.
                fields:
                  - label: Button text
                    name: label
                    widget: string
                  - label: Link
                    name: url
                    widget: string
                    hint: "A section of this page (#contact, #what) or a full address (https://…)."
              - label: Photo
                name: photo
                widget: image
              - label: Photo description (alt text)
                name: photo_alt
                widget: string
              - label: Founder caption
                name: photo_caption
                widget: string
                hint: Vertical label next to the photo.
          - label: "\"Climate change at work\" block"
            name: at_work
            widget: object
            fields:
              - label: Photo
                name: photo
                widget: image
              - label: Photo description (alt text)
                name: photo_alt
                widget: string
              - label: Big line
                name: title
                widget: string
                hint: Put a word between asterisks to set it in italics, e.g. Climate change *at* work.
              - label: Text
                name: text
                widget: text
              - label: Credit
                name: credit
                widget: string
                required: false
          - label: What I do (practice areas)
            name: practice_areas
            widget: list
            summary: "{{title}}"
            hint: Numbered automatically (01, 02, …) in the order shown here. Drag to reorder.
            fields:
              - label: Title
                name: title
                widget: string
              - label: Text
                name: text
                widget: markdown
                buttons:
                  - bold
                  - italic
                  - link
                editor_components: []
          - label: Sample engagements
            name: engagements
            widget: object
            fields:
              - label: Eyebrow
                name: eyebrow
                widget: string
              - label: Title
                name: title
                widget: string
              - label: Engagements
                name: items
                widget: list
                hint: One engagement per item. Drag to reorder.
          - label: Why the name
            name: why
            widget: object
            fields:
              - label: Eyebrow
                name: eyebrow
                widget: string
              - label: Title lines
                name: title_lines
                widget: list
                hint: The second line is set in colour. Type &shy; where a long word may break.
              - label: Commitments
                name: commitments
                widget: list
                summary: "{{title}}"
                fields:
                  - label: Title
                    name: title
                    widget: string
                  - label: Text
                    name: text
                    widget: text
              - label: Italian flair title
                name: flair_title
                widget: string
              - label: Italian flair text
                name: flair_text
                widget: text
          - label: Quotation block (mural)
            name: quote_block
            widget: object
            fields:
              - label: Photo
                name: photo
                widget: image
              - label: Photo description (alt text)
                name: photo_alt
                widget: string
              - label: Quotation
                name: quote
                widget: text
              - label: Source
                name: source
                widget: string
              - label: Original text
                name: original
                widget: string
                required: false
              - label: Language of the original (code)
                name: original_lang
                widget: string
                required: false
                default: es
                hint: e.g. es for Spanish, it for Italian.
              - label: Credit
                name: credit
                widget: string
                required: false
          - label: Collaborations section
            name: collaborations
            widget: object
