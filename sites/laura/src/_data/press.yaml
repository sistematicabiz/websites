- source: Financial Times
  kind: Letter
  title: Markets don’t exist in a liminal cosmic space
  text: A letter on the tendency to treat financial markets as detached from the material world—and why recognizing their dependence on natural systems and planetary limits matters.
  linkText: Read the letter
  url: https://www.ft.com/content/86ccc488-63b2-4afd-9a37-2892d4675a06

- source: SRI360
  kind: Podcast
  title: Nature risk, sustainable investing, and the moral purposes of finance
  text: A conversation with Scott Arnell about my path from energy and climate research to sustainable investing, the role of geospatial data in understanding nature-related financial risk, and the ethical questions beneath investment decisions.
  linkText: Listen to the conversation
  url: https://sri360.com/podcast/laura-segafredo/

- source: MSCI
  kind: Conference
  title: Capital for Climate Action Conference
  text: A contribution to MSCI’s conference on financing the low-carbon transition, highlighting the investment needed to decarbonize high-emitting sectors—and why those sectors are central to the transition, not simply exposures to avoid.
  linkText: Read the conference recap
  url: https://www.msci.com/research-and-insights/blog-post/capital-for-climate-action-conference-key-takeaways

- source: National Association for Business Economics (NABE)
  kind: Webinar
  title: 'Climate Finance: Recent Developments and Trends'
  text: A webinar conversation with Sean Kidney, CEO of the Climate Bonds Initiative, moderated by Ellen Hughes-Cromwick of Third Way, on developments and trends in climate finance
  linkText: Explore the webinar archive
  url: https://www.nabe.com/NABE/Events/NABE_Vault.aspx?WebsiteKey=91b9e16d-e6fe-4f31-a4af-02c194225c32

- source: Americas Society/Council of the Americas
  kind: Panel
  title: Financing Climate Change Adaptation in Latin America
  text: A panel discussion on financing climate adaptation in Latin America, bringing an investment perspective to the challenge of building resilience in a changing climate.
  linkText: Explore the event
  url: https://www.as-coa.org/events/financing-climate-change-adaptation-latin-america

- source: Humanistic Management International
  kind: Podcast
  title: Transforming Finance and Economics as Moral Revolution
  text: A conversation with Anthony Annett about the moral imagination needed to reshape economic life. We explore how dignity, solidarity, ecological responsibility, and insights from history and faith traditions can inform more humane institutions.
  linkText: Listen to the conversation
  url: https://humanisticmanagement.international/podcast/transforming-finance-and-economics-as-moral-revolution-laura-segafredo-and-tony-annett/

