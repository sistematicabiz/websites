# Netlify config for the laura site.
# In the Netlify UI: Base directory = (empty, repo root), Package directory = sites/laura.
# All paths below are relative to the repo root.

[build]
  command = "npm run build:laura"
  publish = "sites/laura/_site"
  # Skip the build (exit 0) unless something this site depends on changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- sites/laura shared content/laura content/shared content/media package.json package-lock.json .nvmrc"

[build.environment]
  NODE_VERSION = "22"
