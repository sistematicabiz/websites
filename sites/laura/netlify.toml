# Netlify site: laurasegafredo.com
# In Netlify: Base directory = (repo root), Package directory = sites/laura
[build]
  command = "npm run fetch:substack && npm run build:laura"
  publish = "sites/laura/_site"
  # Skip the build unless this site, shared/ or dependencies changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- sites/laura shared package.json package-lock.json"

[build.environment]
  NODE_VERSION = "22"
